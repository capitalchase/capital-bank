<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
      content="width=device-width, initial-scale=1.0">

<title>Capital Bank | Withdraw</title>

<link rel="stylesheet"
      href="style.css">

</head>

<body>

<div class="container">

    <div class="bank-card">

        <h2>Withdraw Funds</h2>

        <p>
            Enter the amount you would like to withdraw.
        </p>

        <input
            type="number"
            id="withdrawAmount"
            placeholder="Enter amount"
            min="1"
            step="0.01">

        <button
            type="button"
            onclick="withdrawMoney()">

            Withdraw Funds

        </button>

        <br><br>

        <a href="dashboard.html"
           class="btn">

            Back To Dashboard

        </a>

    </div>

</div>


<script type="module"
        src="app.js">
</script>

</body>

</html>
